name: FastAPI CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -v
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t hemanthreddy1021/devops-fastapi:${{ github.sha }} .

      - name: Push Docker image
        run: docker push hemanthreddy1021/devops-fastapi:${{ github.sha }}
      
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: hemanthreddy90/devops-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image version in GitOps
        run: |
          cd gitops

          sed -i "s|image: .*|image: hemanthreddy1021/devops-fastapi:${{ github.sha }}|" apps/fastapi/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/fastapi/deployment.yaml
          git commit -m "Deploy FastAPI image ${{ github.sha }}"
          git push origin HEAD:main

